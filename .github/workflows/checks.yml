name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    name: guard
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Repository file checks
        run: python scripts/repo_checks.py
      - name: Unit tests (repo guard)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      # unittest discover 不递归无 __init__.py 的子目录：必须逐目录显式运行
      # （本仓已知陷阱；tests/test_repo_structure.py 有守卫测试防回归）
      - name: Unit tests (contracts)
        run: python -B -m unittest discover -s tests/contracts -p "test_*.py" -v
      - name: Unit tests (workflow)
        run: python -B -m unittest discover -s tests/workflow -p "test_*.py" -v
      - name: Unit tests (integrations)
        run: python -B -m unittest discover -s tests/integrations -p "test_*.py" -v

  gitleaks:
    name: gitleaks
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Full secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  repo-check:
    name: repo-check
    if: always()
    needs: [guard, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check job
        run: |
          set -e
          test "${{ needs.guard.result }}" = "success"
          test "${{ needs.gitleaks.result }}" = "success"
